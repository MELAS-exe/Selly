<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Selly</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4f0; color: #173b32;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 26rem; padding: 2rem 1rem; }
      h1 { font: 500 2.25rem/1.1 Georgia, serif; margin: 0 0 .5rem; }
      p { color: #4a5d55; margin: 0 0 1.25rem; }
      button { min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 6px; background: #173b32; color: #f6f4f0;
        font: inherit; font-weight: 500; cursor: pointer; }
      button:focus-visible { outline: 3px solid #173b32; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>You are offline.</h1>
      <p>Your shop keeps working for customers. Reconnect to see new orders and chats.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
