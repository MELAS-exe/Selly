# Local infrastructure. Start with: pnpm infra:up
name: selly

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: selly
      POSTGRES_PASSWORD: selly
      POSTGRES_DB: selly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: selly
      MINIO_ROOT_PASSWORD: selly-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Local Nostr relay for the fake NWC wallet service (packages/nwc/testkit, to be built).
  relay:
    image: scsibug/nostr-rs-relay
    ports:
      - "7777:8080"

volumes:
  pgdata:
  miniodata:
